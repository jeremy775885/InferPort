[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inferport"
version = "0.1.0"
description = "Lightweight inference exchange between model backends and execution environments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21.3,<3", "msgpack>=1.1,<2", "websockets>=16.1.1,<18"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/inferport"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
